[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ies-drl-simulator"
version = "0.1.0"
description = "Deep reinforcement learning starter for electricity-heat-cooling-gas dispatch"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
rl = ["gymnasium==1.2.0", "stable-baselines3==2.7.0", "torch>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]
